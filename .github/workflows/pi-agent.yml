name: Pi Agent Course

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: learn-pi-agent
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: learn-pi-agent/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run course checks
        run: npm run check

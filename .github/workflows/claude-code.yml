name: Claude Code Course

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: learn-claude-code
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: learn-claude-code/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run Python tests
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: learn-claude-code/web
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: learn-claude-code/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Extract course content
        run: npm run extract
      - name: Type check
        run: npx tsc --noEmit
      - name: Build Web course
        run: npm run build

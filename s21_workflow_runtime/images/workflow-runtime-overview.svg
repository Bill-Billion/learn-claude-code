  <rect x="48" y="123" width="126" height="52" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1.5"/>
  <text x="111" y="145" text-anchor="middle" fill="#171717" font-size="12" font-weight="700" font-family="monospace">messages[]</text>
  <text x="111" y="162" text-anchor="middle" fill="#737373" font-size="9">conversation</text>

  <line x1="174" y1="149" x2="214" y2="149" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="216" y="123" width="96" height="52" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1.5"/>
  <text x="264" y="145" text-anchor="middle" fill="#171717" font-size="12" font-weight="700">LLM</text>
  <text x="264" y="162" text-anchor="middle" fill="#737373" font-size="9">chooses tool</text>

  <line x1="312" y1="149" x2="352" y2="149" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>

  <text x="443" y="162" text-anchor="middle" fill="#737373" font-size="9">register background task</text>

  <line x1="532" y1="149" x2="572" y2="149" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="574" y="123" width="146" height="52" rx="6" fill="#f5f5f5" stroke="#a3a3a3" stroke-width="1.5"/>
  <text x="647" y="145" text-anchor="middle" fill="#171717" font-size="11" font-weight="700" font-family="monospace">async_launched</text>

  <rect x="44" y="303" width="130" height="64" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1.5"/>
  <text x="109" y="327" text-anchor="middle" fill="#171717" font-size="11" font-weight="700">Workflow script</text>
  <text x="109" y="345" text-anchor="middle" fill="#737373" font-size="9">conditions · loops</text>
  <text x="109" y="359" text-anchor="middle" fill="#737373" font-size="9">variables · phases</text>

  <line x1="174" y1="335" x2="208" y2="335" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="191" y="326" text-anchor="middle" fill="#16a34a" font-size="9">parallel</text>

  <rect x="210" y="290" width="140" height="54" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1.5"/>
  <text x="280" y="312" text-anchor="middle" fill="#171717" font-size="11" font-weight="700">Audit agent loop</text>
  <text x="280" y="329" text-anchor="middle" fill="#737373" font-size="9">correctness</text>

  <rect x="210" y="356" width="140" height="54" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1.5"/>
  <text x="280" y="378" text-anchor="middle" fill="#171717" font-size="11" font-weight="700">Audit agent loop</text>
  <text x="280" y="395" text-anchor="middle" fill="#737373" font-size="9">maintainability</text>

  <line x1="350" y1="317" x2="388" y2="341" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <line x1="350" y1="383" x2="388" y2="359" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)"/>

  <rect x="390" y="318" width="150" height="64" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1.5"/>
  <text x="465" y="342" text-anchor="middle" fill="#171717" font-size="11" font-weight="700">Consolidate agent</text>
  <text x="465" y="360" text-anchor="middle" fill="#737373" font-size="9">group same root cause</text>
  <text x="465" y="374" text-anchor="middle" fill="#737373" font-size="9">source IDs exactly once</text>

  <line x1="540" y1="350" x2="578" y2="350" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="580" y="318" width="142" height="64" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1.5"/>
  <text x="651" y="342" text-anchor="middle" fill="#171717" font-size="11" font-weight="700">Verification pipeline</text>
  <text x="651" y="360" text-anchor="middle" fill="#737373" font-size="9">one verifier per group</text>
  <text x="651" y="374" text-anchor="middle" fill="#737373" font-size="9">failures stay explicit</text>

  <line x1="722" y1="350" x2="760" y2="350" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="762" y="318" width="142" height="64" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1.5"/>
  <text x="833" y="342" text-anchor="middle" fill="#171717" font-size="11" font-weight="700">Final report</text>
  <text x="833" y="360" text-anchor="middle" fill="#737373" font-size="9">rank confirmed issues</text>
  <text x="833" y="374" text-anchor="middle" fill="#737373" font-size="9">confirmed · incomplete</text>

  <rect x="762" y="406" width="142" height="40" rx="6" fill="#f5f5f5" stroke="#a3a3a3" stroke-width="1.5"/>
  <text x="833" y="424" text-anchor="middle" fill="#171717" font-size="10.5" font-weight="700">Journal</text>
  <text x="833" y="439" text-anchor="middle" fill="#737373" font-size="8.5">resume in agent start order</text>
  <path d="M762 426H651V382" fill="none" stroke="#737373" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow-gray)"/>

  <path d="M443 175V224H109V303" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>
  <path d="M904 350H920V208H843V175" fill="none" stroke="#737373" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-gray)"/>

  <text x="480" y="500" text-anchor="middle" fill="#737373" font-size="10">The model handles judgment inside each agent; the script handles launch, waiting, data flow, and completion.</text>
</svg>

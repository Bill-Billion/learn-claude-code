  <text x="843" y="145" text-anchor="middle" fill="#171717" font-size="11" font-weight="700">task_notification</text>
  <text x="843" y="162" text-anchor="middle" fill="#737373" font-size="9">result returns</text>

  <path d="M843 123V108H111V123" fill="none" stroke="#737373" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow-gray)"/>


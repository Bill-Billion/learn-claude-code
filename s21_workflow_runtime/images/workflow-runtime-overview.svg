  </defs>

  <rect width="960" height="520" rx="8" fill="#ffffff"/>
  <text x="480" y="31" text-anchor="middle" fill="#171717" font-size="19" font-weight="700">Workflow Runtime</text>
  <text x="480" y="52" text-anchor="middle" fill="#737373" font-size="12">one tool call starts a background task; the script arranges complete agent loops</text>

  <rect x="24" y="76" width="912" height="132" rx="8" fill="#ffffff" stroke="#d4d4d4" stroke-width="1.5" stroke-dasharray="6 4"/>

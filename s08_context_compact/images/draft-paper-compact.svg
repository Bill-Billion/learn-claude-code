<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888888"/>
    </marker>
  </defs>

  <rect width="920" height="460" rx="8" fill="#ffffff"/>

  <text x="460" y="34" fill="#1a1a1a" font-size="20" font-weight="700" text-anchor="middle">给 Agent 的草稿纸瘦瘦身</text>
  <text x="460" y="54" fill="#888888" font-size="12" text-anchor="middle">能收起来的先收起来，能擦掉的先擦掉，实在不够再写摘要</text>
  <line x1="40" y1="72" x2="880" y2="72" stroke="#d0d0d0" stroke-width="1"/>

  <!-- Full scratch paper -->
  <g transform="translate(56 108)">
    <rect x="0" y="0" width="210" height="270" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M 172 0 L 210 38 L 172 38 Z" fill="#fafafa" stroke="#d0d0d0" stroke-width="1"/>
    <text x="105" y="34" fill="#1a1a1a" font-size="14" font-weight="700" text-anchor="middle">写满的草稿纸</text>
    <text x="105" y="54" fill="#888888" font-size="10" text-anchor="middle" font-family="monospace">messages[]</text>

    <rect x="22" y="76" width="166" height="20" rx="4" fill="#fafafa" stroke="#d0d0d0" stroke-width="1"/>
    <text x="105" y="90" fill="#1a1a1a" font-size="10" font-weight="600" text-anchor="middle">原始任务和约束</text>

    <g stroke="#d0d0d0" stroke-width="1">
      <line x1="26" y1="116" x2="184" y2="116"/>
      <line x1="26" y1="132" x2="158" y2="132"/>
      <line x1="26" y1="148" x2="178" y2="148"/>
      <line x1="26" y1="164" x2="148" y2="164"/>
    </g>
    <rect x="22" y="182" width="166" height="38" rx="4" fill="#fafafa" stroke="#22c55e" stroke-width="1.2"/>
    <text x="105" y="199" fill="#1a1a1a" font-size="10" font-weight="600" text-anchor="middle">很长的工具结果</text>
    <text x="105" y="213" fill="#888888" font-size="9" text-anchor="middle" font-family="monospace">file/log/output...</text>
    <g stroke="#d0d0d0" stroke-width="1">
      <line x1="26" y1="238" x2="184" y2="238"/>
      <line x1="26" y1="252" x2="130" y2="252"/>
    </g>

    <text x="105" y="296" fill="#888888" font-size="11" text-anchor="middle">旧日志和旧文件内容越堆越多</text>
  </g>

  <!-- Pipeline -->
  <g transform="translate(338 98)">
    <rect x="0" y="0" width="244" height="290" rx="8" fill="#ffffff" stroke="#d0d0d0" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="122" y="28" fill="#1a1a1a" font-size="14" font-weight="700" text-anchor="middle">先整理，再总结</text>

    <g>
      <rect x="24" y="52" width="196" height="38" rx="4" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.2"/>
      <circle cx="44" cy="71" r="10" fill="#1a1a1a"/>
      <text x="44" y="75" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">1</text>
      <text x="72" y="68" fill="#1a1a1a" font-size="11" font-weight="700">大结果存磁盘</text>
      <text x="72" y="82" fill="#888888" font-size="9">上下文只留路径和预览</text>
    </g>
    <line x1="122" y1="90" x2="122" y2="108" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green)"/>

    <g>
      <rect x="24" y="112" width="196" height="38" rx="4" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.2"/>
      <circle cx="44" cy="131" r="10" fill="#1a1a1a"/>
      <text x="44" y="135" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">2</text>
      <text x="72" y="128" fill="#1a1a1a" font-size="11" font-weight="700">中间旧历史裁掉</text>
      <text x="72" y="142" fill="#888888" font-size="9">保留开头和最新进度</text>
    </g>
    <line x1="122" y1="150" x2="122" y2="168" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green)"/>

    <g>
      <rect x="24" y="172" width="196" height="38" rx="4" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.2"/>
      <circle cx="44" cy="191" r="10" fill="#1a1a1a"/>
      <text x="44" y="195" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">3</text>
      <text x="72" y="188" fill="#1a1a1a" font-size="11" font-weight="700">旧工具结果换便签</text>
      <text x="72" y="202" fill="#888888" font-size="9">需要时再重新读取</text>
    </g>
    <line x1="122" y1="210" x2="122" y2="228" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green)"/>

    <g>
      <rect x="24" y="232" width="196" height="38" rx="4" fill="#ffffff" stroke="#22c55e" stroke-width="1.4"/>
      <circle cx="44" cy="251" r="10" fill="#22c55e"/>
      <text x="44" y="255" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">4</text>
      <text x="72" y="248" fill="#1a1a1a" font-size="11" font-weight="700">还不够，再写摘要</text>
      <text x="72" y="262" fill="#888888" font-size="9">有损，所以放最后</text>
    </g>
  </g>

  <!-- Arrows -->
  <path d="M 286 235 L 330 235" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M 590 235 L 634 235" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Clean scratch paper -->
  <g transform="translate(654 108)">
    <rect x="0" y="0" width="210" height="270" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M 172 0 L 210 38 L 172 38 Z" fill="#fafafa" stroke="#d0d0d0" stroke-width="1"/>
    <text x="105" y="34" fill="#1a1a1a" font-size="14" font-weight="700" text-anchor="middle">瘦身后的草稿纸</text>
    <text x="105" y="54" fill="#888888" font-size="10" text-anchor="middle" font-family="monospace">compact messages[]</text>

    <rect x="22" y="76" width="166" height="20" rx="4" fill="#fafafa" stroke="#d0d0d0" stroke-width="1"/>
    <text x="105" y="90" fill="#1a1a1a" font-size="10" font-weight="600" text-anchor="middle">原始要求仍在</text>

    <rect x="22" y="118" width="166" height="32" rx="4" fill="#ffffff" stroke="#d0d0d0" stroke-width="1" stroke-dasharray="5,3"/>
    <text x="105" y="137" fill="#888888" font-size="10" text-anchor="middle">[snipped 旧过程]</text>

    <rect x="22" y="172" width="166" height="34" rx="4" fill="#fafafa" stroke="#22c55e" stroke-width="1.2"/>
    <text x="105" y="188" fill="#1a1a1a" font-size="10" font-weight="600" text-anchor="middle">最新工具结果完整保留</text>
    <text x="105" y="200" fill="#888888" font-size="9" text-anchor="middle">当前正在用的信息</text>

    <rect x="22" y="226" width="166" height="22" rx="4" fill="#ffffff" stroke="#d0d0d0" stroke-width="1"/>
    <text x="105" y="241" fill="#888888" font-size="9" text-anchor="middle" font-family="monospace">[Compacted] summary</text>

    <text x="105" y="296" fill="#888888" font-size="11" text-anchor="middle">重点清楚，任务继续</text>
  </g>

  <!-- Notebook / disk hint -->
  <g transform="translate(270 390)">
    <rect x="0" y="0" width="380" height="38" rx="6" fill="#fafafa" stroke="#d0d0d0" stroke-width="1"/>
    <path d="M 20 10 L 38 10 L 46 18 L 46 28 L 20 28 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
    <path d="M 38 10 L 38 18 L 46 18" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    <text x="68" y="24" fill="#1a1a1a" font-size="11" font-weight="600">完整内容没有凭空消失：</text>
    <text x="190" y="24" fill="#888888" font-size="11" font-family="monospace">.task_outputs/</text>
    <line x1="300" y1="19" x2="336" y2="19" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
    <text x="352" y="24" fill="#888888" font-size="11">可重读</text>
  </g>
</svg>

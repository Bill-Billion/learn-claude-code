<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="l4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#22c55e"/>
    </marker>
  </defs>

  <rect width="760" height="440" rx="6" fill="#ffffff"/>
  <text x="380" y="30" fill="#1a1a1a" font-size="20" font-weight="700" text-anchor="middle">L4：把整本历史写成工作摘要</text>
  <text x="380" y="51" fill="#888888" font-size="12" text-anchor="middle">先把厚厚的原稿装订留底，再读完、划重点，重写成当前要用的一页纸</text>
  <line x1="36" y1="68" x2="724" y2="68" stroke="#d0d0d0"/>

  <line x1="30" y1="342" x2="730" y2="342" stroke="#d0d0d0" stroke-width="1.5"/>

  <!-- Thick full-history stack -->
  <g>
    <rect x="59" y="117" width="174" height="180" rx="5" fill="#fafafa" stroke="#d0d0d0" transform="rotate(3 146 207)"/>
    <rect x="51" y="111" width="174" height="180" rx="5" fill="#fafafa" stroke="#d0d0d0" transform="rotate(-2 138 201)"/>
    <rect x="43" y="103" width="174" height="180" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M183 103 L217 137 L183 137 Z" fill="#fafafa" stroke="#d0d0d0"/>
    <rect x="95" y="94" width="70" height="20" rx="4" fill="#1a1a1a"/>
    <path d="M108 94 V86 H152 V94" fill="none" stroke="#888888" stroke-width="2"/>
    <text x="130" y="136" fill="#1a1a1a" font-size="13" font-weight="700" text-anchor="middle">完整历史</text>
    <text x="130" y="153" fill="#888888" font-size="9" text-anchor="middle" font-family="monospace">messages[]</text>
    <g stroke="#d0d0d0">
      <line x1="67" y1="174" x2="191" y2="174"/>
      <line x1="67" y1="188" x2="174" y2="188"/>
      <line x1="67" y1="202" x2="194" y2="202"/>
      <line x1="67" y1="216" x2="163" y2="216"/>
      <line x1="67" y1="230" x2="190" y2="230"/>
      <line x1="67" y1="244" x2="178" y2="244"/>
      <line x1="67" y1="258" x2="192" y2="258"/>
    </g>
    <text x="130" y="276" fill="#888888" font-size="9" text-anchor="middle">目标、对话、日志、文件内容</text>
  </g>

  <!-- Step 1: full transcript goes into archive drawer -->
  <g>
    <path d="M130 287 V306" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#l4-arrow)"/>
    <rect x="42" y="311" width="190" height="43" rx="4" fill="#ffffff" stroke="#22c55e" stroke-width="1.6"/>
    <rect x="53" y="319" width="168" height="25" rx="3" fill="#fafafa" stroke="#d0d0d0"/>
    <circle cx="69" cy="331" r="4" fill="#22c55e"/>
    <text x="138" y="335" fill="#1a1a1a" font-size="10" font-weight="700" text-anchor="middle" font-family="monospace">transcript 完整留底</text>
    <circle cx="40" cy="298" r="11" fill="#1a1a1a"/>
    <text x="40" y="302" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">1</text>
  </g>

  <!-- Step 2: feed the history into a reading funnel -->
  <path d="M224 176 C252 151 271 145 294 145" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#l4-arrow)"/>
  <circle cx="257" cy="129" r="11" fill="#1a1a1a"/>
  <text x="257" y="133" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">2</text>
  <text x="273" y="109" fill="#1a1a1a" font-size="11" font-weight="700" text-anchor="middle">读完再重写</text>

  <g>
    <path d="M286 137 H482 L427 224 V276 H341 V224 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M300 152 H468" stroke="#d0d0d0"/>
    <path d="M311 168 H457" stroke="#d0d0d0"/>
    <path d="M321 184 H447" stroke="#d0d0d0"/>
    <path d="M332 200 H436" stroke="#d0d0d0"/>
    <text x="384" y="129" fill="#888888" font-size="10" text-anchor="middle">整本历史进入阅读漏斗</text>

    <rect x="344" y="222" width="80" height="18" rx="3" fill="#fafafa" stroke="#22c55e"/>
    <text x="384" y="235" fill="#1a1a1a" font-size="9" font-weight="700" text-anchor="middle">关键线索</text>
    <g fill="#22c55e">
      <circle cx="356" cy="255" r="3"/>
      <circle cx="371" cy="255" r="3"/>
      <circle cx="386" cy="255" r="3"/>
      <circle cx="401" cy="255" r="3"/>
      <circle cx="416" cy="255" r="3"/>
    </g>
  </g>

  <!-- Faint details fall away: the summary is lossy -->
  <g fill="#888888" font-size="8">
    <text x="278" y="213" transform="rotate(-14 278 213)">逐字细节</text>
    <text x="273" y="247" transform="rotate(11 273 247)">旧日志</text>
    <text x="459" y="221" transform="rotate(13 459 221)">重复过程</text>
    <text x="468" y="258" transform="rotate(-9 468 258)">冗长输出</text>
  </g>
  <g stroke="#d0d0d0" stroke-width="1.2">
    <line x1="288" y1="227" x2="278" y2="233"/>
    <line x1="296" y1="249" x2="286" y2="258"/>
    <line x1="472" y1="233" x2="482" y2="240"/>
    <line x1="461" y1="268" x2="475" y2="276"/>
  </g>

  <!-- One-page active brief -->
  <path d="M427 255 C475 255 492 203 533 203" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#l4-arrow)"/>
  <g transform="rotate(1 628 211)">
    <rect x="538" y="99" width="182" height="236" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M686 99 L720 133 L686 133 Z" fill="#fafafa" stroke="#d0d0d0"/>
    <rect x="590" y="91" width="78" height="20" rx="4" fill="#22c55e"/>
    <path d="M604 91 V84 H654 V91" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <text x="629" y="137" fill="#1a1a1a" font-size="13" font-weight="700" text-anchor="middle">当前工作摘要</text>
    <text x="629" y="154" fill="#888888" font-size="9" text-anchor="middle" font-family="monospace">[Compacted]</text>

    <g font-size="10">
      <circle cx="565" cy="178" r="4" fill="#22c55e"/>
      <text x="578" y="182" fill="#1a1a1a" font-weight="700">目标</text>
      <line x1="612" y1="179" x2="693" y2="179" stroke="#d0d0d0"/>

      <circle cx="565" cy="207" r="4" fill="#22c55e"/>
      <text x="578" y="211" fill="#1a1a1a" font-weight="700">约束</text>
      <line x1="612" y1="208" x2="684" y2="208" stroke="#d0d0d0"/>

      <circle cx="565" cy="236" r="4" fill="#22c55e"/>
      <text x="578" y="240" fill="#1a1a1a" font-weight="700">发现</text>
      <line x1="612" y1="237" x2="691" y2="237" stroke="#d0d0d0"/>

      <circle cx="565" cy="265" r="4" fill="#22c55e"/>
      <text x="578" y="269" fill="#1a1a1a" font-weight="700">文件</text>
      <line x1="612" y1="266" x2="679" y2="266" stroke="#d0d0d0"/>

      <circle cx="565" cy="294" r="4" fill="#22c55e"/>
      <text x="578" y="298" fill="#1a1a1a" font-weight="700">下一步</text>
      <line x1="622" y1="295" x2="694" y2="295" stroke="#d0d0d0"/>
    </g>
    <text x="629" y="320" fill="#888888" font-size="9" text-anchor="middle">一页替换当前旧历史</text>
  </g>

  <g transform="translate(94 374)">
    <rect width="572" height="38" rx="5" fill="#fafafa" stroke="#d0d0d0"/>
    <text x="286" y="24" fill="#1a1a1a" font-size="12" font-weight="600" text-anchor="middle">完整原稿仍可追溯，但当前上下文只剩摘要；有损，所以最后才用</text>
  </g>
</svg>

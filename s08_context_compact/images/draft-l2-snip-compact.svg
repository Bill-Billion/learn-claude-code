<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/>
    </marker>
  </defs>

  <rect width="760" height="420" rx="8" fill="#ffffff"/>
  <text x="380" y="32" fill="#1a1a1a" font-size="20" font-weight="700" text-anchor="middle">L2: snip_compact</text>
  <text x="380" y="52" fill="#888888" font-size="12" text-anchor="middle">消息太多时：保留开头和结尾，把中间旧过程裁成一行说明</text>
  <line x1="40" y1="70" x2="720" y2="70" stroke="#d0d0d0"/>

  <!-- Before paper -->
  <g transform="translate(64 98)">
    <rect x="0" y="0" width="210" height="250" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M 174 0 L 210 36 L 174 36 Z" fill="#fafafa" stroke="#d0d0d0"/>
    <text x="105" y="30" fill="#1a1a1a" font-size="13" font-weight="700" text-anchor="middle">整理前</text>
    <text x="105" y="48" fill="#888888" font-size="10" text-anchor="middle" font-family="monospace">80 messages</text>

    <rect x="24" y="66" width="162" height="34" rx="4" fill="#fafafa" stroke="#1a1a1a" stroke-width="1"/>
    <text x="105" y="86" fill="#1a1a1a" font-size="10" font-weight="700" text-anchor="middle">开头：原始任务和规则</text>

    <rect x="24" y="112" width="162" height="82" rx="5" fill="#ffffff" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="105" y="134" fill="#1a1a1a" font-size="10" font-weight="700" text-anchor="middle">中间旧过程</text>
    <g stroke="#d0d0d0">
      <line x1="44" y1="150" x2="166" y2="150"/>
      <line x1="44" y1="164" x2="148" y2="164"/>
      <line x1="44" y1="178" x2="160" y2="178"/>
    </g>
    <text x="105" y="207" fill="#888888" font-size="9" text-anchor="middle" font-family="monospace">messages 4...52</text>

    <rect x="24" y="214" width="162" height="24" rx="4" fill="#fafafa" stroke="#1a1a1a" stroke-width="1"/>
    <text x="105" y="230" fill="#1a1a1a" font-size="10" font-weight="700" text-anchor="middle">结尾：最新进度</text>
  </g>

  <!-- Action -->
  <g transform="translate(314 130)">
    <path d="M 0 76 L 42 76" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green)" fill="none"/>
    <rect x="56" y="32" width="76" height="88" rx="6" fill="#fafafa" stroke="#d0d0d0"/>
    <path d="M 82 48 C 95 68 95 88 82 108" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M 106 48 C 93 68 93 88 106 108" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <circle cx="76" cy="62" r="5" fill="#ffffff" stroke="#1a1a1a"/>
    <circle cx="112" cy="62" r="5" fill="#ffffff" stroke="#1a1a1a"/>
    <text x="94" y="144" fill="#1a1a1a" font-size="12" font-weight="700" text-anchor="middle">safe_head + safe_tail</text>
    <text x="94" y="162" fill="#888888" font-size="10" text-anchor="middle">不拆 tool_use / tool_result</text>
    <path d="M 146 76 L 188 76" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green)" fill="none"/>
  </g>

  <!-- After paper -->
  <g transform="translate(506 98)">
    <rect x="0" y="0" width="210" height="250" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M 174 0 L 210 36 L 174 36 Z" fill="#fafafa" stroke="#d0d0d0"/>
    <text x="105" y="30" fill="#1a1a1a" font-size="13" font-weight="700" text-anchor="middle">整理后</text>
    <text x="105" y="48" fill="#888888" font-size="10" text-anchor="middle" font-family="monospace">head + marker + tail</text>

    <rect x="24" y="66" width="162" height="34" rx="4" fill="#fafafa" stroke="#1a1a1a" stroke-width="1"/>
    <text x="105" y="86" fill="#1a1a1a" font-size="10" font-weight="700" text-anchor="middle">开头仍完整保留</text>

    <rect x="24" y="126" width="162" height="42" rx="5" fill="#ffffff" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="105" y="151" fill="#888888" font-size="10" font-weight="600" text-anchor="middle" font-family="monospace">[snipped 49 messages]</text>

    <rect x="24" y="204" width="162" height="34" rx="4" fill="#fafafa" stroke="#1a1a1a" stroke-width="1"/>
    <text x="105" y="225" fill="#1a1a1a" font-size="10" font-weight="700" text-anchor="middle">最新进度仍完整保留</text>
  </g>

  <g transform="translate(140 360)">
    <rect x="0" y="0" width="480" height="34" rx="6" fill="#fafafa" stroke="#d0d0d0"/>
    <text x="240" y="22" fill="#1a1a1a" font-size="12" font-weight="600" text-anchor="middle">核心动作：裁消息数量，头尾留下，中间换成省略标记</text>
  </g>
</svg>

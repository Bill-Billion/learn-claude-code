<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="l1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#22c55e"/>
    </marker>
  </defs>

  <rect width="760" height="440" rx="6" fill="#ffffff"/>
  <text x="380" y="30" fill="#1a1a1a" font-size="20" font-weight="700" text-anchor="middle">L1：把大结果搬出草稿纸</text>
  <text x="380" y="51" fill="#888888" font-size="12" text-anchor="middle">完整输出进档案盒，当前上下文只留一张找得回来的便签</text>
  <line x1="36" y1="68" x2="724" y2="68" stroke="#d0d0d0"/>

  <line x1="30" y1="338" x2="730" y2="338" stroke="#d0d0d0" stroke-width="1.5"/>

  <!-- Scratch paper overwhelmed by one long result -->
  <g transform="rotate(-2 150 208)">
    <rect x="38" y="91" width="228" height="238" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M230 91 L266 127 L230 127 Z" fill="#fafafa" stroke="#d0d0d0"/>
    <circle cx="58" cy="104" r="3" fill="#ffffff" stroke="#888888"/>
    <circle cx="58" cy="126" r="3" fill="#ffffff" stroke="#888888"/>
    <circle cx="58" cy="148" r="3" fill="#ffffff" stroke="#888888"/>
    <text x="152" y="119" fill="#1a1a1a" font-size="13" font-weight="700" text-anchor="middle">当前上下文</text>
    <text x="152" y="137" fill="#888888" font-size="10" text-anchor="middle">一条结果占满半张纸</text>
    <rect x="68" y="154" width="164" height="34" rx="4" fill="#fafafa" stroke="#d0d0d0"/>
    <text x="150" y="175" fill="#888888" font-size="10" text-anchor="middle">任务、约束、最近对话</text>
    <rect x="68" y="202" width="164" height="99" rx="4" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
    <text x="150" y="223" fill="#1a1a1a" font-size="11" font-weight="700" text-anchor="middle">巨大 tool_result</text>
    <g stroke="#d0d0d0" stroke-width="1.2">
      <line x1="86" y1="242" x2="214" y2="242"/>
      <line x1="86" y1="255" x2="202" y2="255"/>
      <line x1="86" y1="268" x2="216" y2="268"/>
      <line x1="86" y1="281" x2="192" y2="281"/>
    </g>
  </g>

  <!-- A long paper ribbon is physically pulled out -->
  <path d="M250 214 C296 214 315 184 354 184 C393 184 405 201 405 231" fill="none" stroke="#1a1a1a" stroke-width="58" stroke-linecap="butt" stroke-linejoin="round"/>
  <path d="M250 214 C296 214 315 184 354 184 C393 184 405 201 405 231" fill="none" stroke="#ffffff" stroke-width="54" stroke-linecap="butt" stroke-linejoin="round"/>
  <g stroke="#d0d0d0" stroke-width="1.2">
    <line x1="274" y1="199" x2="300" y2="196"/>
    <line x1="280" y1="214" x2="312" y2="208"/>
    <line x1="289" y1="228" x2="321" y2="218"/>
    <line x1="332" y1="170" x2="363" y2="170"/>
    <line x1="338" y1="184" x2="376" y2="184"/>
    <line x1="342" y1="198" x2="376" y2="198"/>
  </g>
  <path d="M278 137 C326 111 377 112 414 145" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#l1-arrow)"/>
  <text x="348" y="112" fill="#1a1a1a" font-size="12" font-weight="700" text-anchor="middle">搬出去</text>

  <!-- Archive box -->
  <g>
    <path d="M326 221 L354 204 H468 L490 221" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M326 221 H490 V321 H326 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M326 221 L344 238 H472 L490 221" fill="#fafafa" stroke="#d0d0d0"/>
    <rect x="349" y="258" width="118" height="38" rx="4" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
    <text x="408" y="274" fill="#1a1a1a" font-size="11" font-weight="700" text-anchor="middle">完整输出</text>
    <text x="408" y="288" fill="#888888" font-size="9" text-anchor="middle" font-family="monospace">.task_outputs/</text>
    <path d="M395 238 V253" stroke="#22c55e" stroke-width="2" marker-end="url(#l1-arrow)"/>
  </g>

  <!-- Clean scratch paper with retrieval note -->
  <g transform="rotate(2 624 215)">
    <rect x="528" y="99" width="192" height="230" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M686 99 L720 133 L686 133 Z" fill="#fafafa" stroke="#d0d0d0"/>
    <text x="624" y="128" fill="#1a1a1a" font-size="13" font-weight="700" text-anchor="middle">腾出的草稿纸</text>
    <rect x="548" y="148" width="150" height="30" rx="4" fill="#fafafa" stroke="#d0d0d0"/>
    <text x="623" y="167" fill="#888888" font-size="10" text-anchor="middle">任务和最新进度仍在</text>
    <rect x="548" y="198" width="150" height="92" rx="4" fill="#ffffff" stroke="#22c55e" stroke-width="1.7"/>
    <path d="M548 198 H698 V217 H548 Z" fill="#fafafa" stroke="#22c55e" stroke-width="1.2"/>
    <circle cx="562" cy="208" r="4" fill="#22c55e"/>
    <text x="623" y="212" fill="#1a1a1a" font-size="10" font-weight="700" text-anchor="middle">取回便签</text>
    <text x="562" y="239" fill="#888888" font-size="9" font-family="monospace">路径：.../result.txt</text>
    <text x="562" y="257" fill="#888888" font-size="9">预览：开头一小段</text>
    <g stroke="#d0d0d0">
      <line x1="562" y1="271" x2="681" y2="271"/>
      <line x1="562" y1="280" x2="654" y2="280"/>
    </g>
  </g>

  <path d="M484 176 C511 157 526 158 545 178" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#l1-arrow)"/>
  <text x="511" y="143" fill="#888888" font-size="10" text-anchor="middle">留下索引</text>

  <g transform="translate(123 373)">
    <rect width="514" height="38" rx="5" fill="#fafafa" stroke="#d0d0d0"/>
    <text x="257" y="24" fill="#1a1a1a" font-size="12" font-weight="600" text-anchor="middle">不是删掉大结果，而是把正文搬走，再留一张可以找回它的便签</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888888"/>
    </marker>
  </defs>

  <rect width="760" height="420" rx="8" fill="#ffffff"/>
  <text x="380" y="32" fill="#1a1a1a" font-size="20" font-weight="700" text-anchor="middle">L1: tool_result_budget</text>
  <text x="380" y="52" fill="#888888" font-size="12" text-anchor="middle">单条工具结果太大时：完整内容存磁盘，草稿纸只留路径和预览</text>
  <line x1="40" y1="70" x2="720" y2="70" stroke="#d0d0d0"/>

  <!-- Before paper -->
  <g transform="translate(52 104)">
    <rect x="0" y="0" width="190" height="230" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M 154 0 L 190 36 L 154 36 Z" fill="#fafafa" stroke="#d0d0d0"/>
    <text x="95" y="30" fill="#1a1a1a" font-size="13" font-weight="700" text-anchor="middle">整理前</text>
    <text x="95" y="48" fill="#888888" font-size="10" text-anchor="middle" font-family="monospace">latest message</text>

    <rect x="22" y="68" width="146" height="24" rx="4" fill="#fafafa" stroke="#d0d0d0"/>
    <text x="95" y="84" fill="#888888" font-size="10" text-anchor="middle">tool_result A</text>
    <rect x="22" y="104" width="146" height="84" rx="5" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
    <text x="95" y="128" fill="#1a1a1a" font-size="11" font-weight="700" text-anchor="middle">巨大 tool_result</text>
    <text x="95" y="146" fill="#888888" font-size="9" text-anchor="middle" font-family="monospace">200KB+ output</text>
    <line x1="42" y1="162" x2="148" y2="162" stroke="#d0d0d0"/>
    <line x1="42" y1="176" x2="126" y2="176" stroke="#d0d0d0"/>
    <rect x="22" y="198" width="146" height="18" rx="4" fill="#fafafa" stroke="#d0d0d0"/>
    <text x="95" y="211" fill="#888888" font-size="9" text-anchor="middle">tool_result C</text>
  </g>

  <!-- Action -->
  <g transform="translate(286 122)">
    <path d="M 0 92 L 46 92" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green)" fill="none"/>
    <rect x="58" y="54" width="118" height="76" rx="6" fill="#fafafa" stroke="#d0d0d0"/>
    <path d="M 84 76 L 112 76 L 124 88 L 124 112 L 84 112 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
    <path d="M 112 76 L 112 88 L 124 88" fill="none" stroke="#1a1a1a"/>
    <text x="117" y="144" fill="#1a1a1a" font-size="12" font-weight="700" text-anchor="middle">persist_large_output()</text>
    <text x="117" y="162" fill="#888888" font-size="10" text-anchor="middle" font-family="monospace">.task_outputs/...</text>
    <path d="M 188 92 L 234 92" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green)" fill="none"/>
  </g>

  <!-- After paper -->
  <g transform="translate(518 104)">
    <rect x="0" y="0" width="190" height="230" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M 154 0 L 190 36 L 154 36 Z" fill="#fafafa" stroke="#d0d0d0"/>
    <text x="95" y="30" fill="#1a1a1a" font-size="13" font-weight="700" text-anchor="middle">整理后</text>
    <text x="95" y="48" fill="#888888" font-size="10" text-anchor="middle" font-family="monospace">same message</text>

    <rect x="22" y="68" width="146" height="24" rx="4" fill="#fafafa" stroke="#d0d0d0"/>
    <text x="95" y="84" fill="#888888" font-size="10" text-anchor="middle">tool_result A</text>
    <rect x="22" y="104" width="146" height="84" rx="5" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
    <text x="95" y="123" fill="#1a1a1a" font-size="10" font-weight="700" text-anchor="middle">persisted-output</text>
    <text x="95" y="142" fill="#888888" font-size="9" text-anchor="middle" font-family="monospace">Full output: path</text>
    <text x="95" y="157" fill="#888888" font-size="9" text-anchor="middle" font-family="monospace">Preview: first 2KB</text>
    <line x1="42" y1="176" x2="148" y2="176" stroke="#d0d0d0"/>
    <rect x="22" y="198" width="146" height="18" rx="4" fill="#fafafa" stroke="#d0d0d0"/>
    <text x="95" y="211" fill="#888888" font-size="9" text-anchor="middle">tool_result C</text>
  </g>

  <g transform="translate(144 358)">
    <rect x="0" y="0" width="472" height="34" rx="6" fill="#fafafa" stroke="#d0d0d0"/>
    <text x="236" y="22" fill="#1a1a1a" font-size="12" font-weight="600" text-anchor="middle">核心动作：大块内容搬出上下文，但留一条可找回的索引</text>
  </g>
</svg>

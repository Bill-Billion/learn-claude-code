        <line x1="456" y1="160" x2="513" y2="160"/>
        <line x1="456" y1="173" x2="504" y2="173"/>
        <line x1="456" y1="186" x2="515" y2="186"/>
        <line x1="456" y1="199" x2="497" y2="199"/>
        <line x1="456" y1="212" x2="513" y2="212"/>
        <line x1="456" y1="225" x2="505" y2="225"/>
        <line x1="456" y1="238" x2="515" y2="238"/>
        <line x1="456" y1="251" x2="497" y2="251"/>
        <line x1="456" y1="264" x2="509" y2="264"/>

  <path d="M55 146 C76 135 89 151 107 142 C126 132 139 145 154 137 V258 H55 Z" fill="#ffffff"/>
  <path d="M177 140 C193 128 211 143 229 134 C248 126 259 139 275 132 V258 H177 Z" fill="#ffffff"/>


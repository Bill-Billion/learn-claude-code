  <!-- Green clip groups exactly the latest three -->
  <path d="M342 115 V96 H628 V115" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M356 112 V105 H614 V112" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
  <text x="485" y="88" fill="#1a1a1a" font-size="11" font-weight="700" text-anchor="middle">最近 3 条完整保留</text>

  <!-- Timeline -->
  <path d="M61 326 H690" fill="none" stroke="#22c55e" stroke-width="1.8" marker-end="url(#l3-arrow)"/>
  <text x="61" y="320" fill="#888888" font-size="9">更早</text>
  <text x="688" y="320" fill="#888888" font-size="9" text-anchor="end">更新</text>

  <g transform="translate(104 374)">
    <rect width="552" height="38" rx="5" fill="#fafafa" stroke="#d0d0d0"/>
    <text x="276" y="24" fill="#1a1a1a" font-size="12" font-weight="600" text-anchor="middle">消息的位置还在；被换掉的只是较早、较长的工具结果正文</text>

    <path d="M254 105 L278 129 L254 129 Z" fill="#fafafa" stroke="#d0d0d0" stroke-dasharray="4,3"/>
    <text x="226" y="133" fill="#888888" font-size="11" font-weight="700" text-anchor="middle">结果 #2</text>
    <g stroke="#d0d0d0">

    <text x="104" y="271" fill="#888888" font-size="8" text-anchor="middle" font-family="monospace">[Earlier result</text>
    <text x="104" y="284" fill="#888888" font-size="8" text-anchor="middle" font-family="monospace">compacted]</text>
    <rect x="182" y="254" width="88" height="42" rx="4" fill="#fafafa" stroke="#888888" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="226" y="271" fill="#888888" font-size="8" text-anchor="middle" font-family="monospace">[Earlier result</text>
    <text x="226" y="284" fill="#888888" font-size="8" text-anchor="middle" font-family="monospace">compacted]</text>
  </g>


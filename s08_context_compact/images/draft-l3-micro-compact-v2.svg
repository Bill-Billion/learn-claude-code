        <line x1="574" y1="166" x2="631" y2="166"/>
        <line x1="574" y1="179" x2="622" y2="179"/>
        <line x1="574" y1="192" x2="633" y2="192"/>
        <line x1="574" y1="205" x2="615" y2="205"/>
        <line x1="574" y1="218" x2="631" y2="218"/>
        <line x1="574" y1="231" x2="623" y2="231"/>
        <line x1="574" y1="244" x2="633" y2="244"/>
        <line x1="574" y1="257" x2="615" y2="257"/>
        <line x1="574" y1="270" x2="627" y2="270"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888888"/>
    </marker>
  </defs>

  <rect width="760" height="420" rx="8" fill="#ffffff"/>
  <text x="380" y="32" fill="#1a1a1a" font-size="20" font-weight="700" text-anchor="middle">L4: compact_history</text>
  <text x="380" y="52" fill="#888888" font-size="12" text-anchor="middle">前三步仍不够时：完整 transcript 先落盘，再用摘要替换旧历史</text>
  <line x1="40" y1="70" x2="720" y2="70" stroke="#d0d0d0"/>

  <!-- Before stack -->
  <g transform="translate(54 118)">
    <rect x="20" y="20" width="176" height="206" rx="6" fill="#fafafa" stroke="#d0d0d0"/>
    <rect x="10" y="10" width="176" height="206" rx="6" fill="#fafafa" stroke="#d0d0d0"/>
    <rect x="0" y="0" width="176" height="206" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M 142 0 L 176 34 L 142 34 Z" fill="#fafafa" stroke="#d0d0d0"/>
    <text x="88" y="30" fill="#1a1a1a" font-size="13" font-weight="700" text-anchor="middle">完整历史</text>
    <text x="88" y="48" fill="#888888" font-size="10" text-anchor="middle" font-family="monospace">messages[] still huge</text>
    <g stroke="#d0d0d0">
      <line x1="24" y1="74" x2="150" y2="74"/>
      <line x1="24" y1="92" x2="132" y2="92"/>
      <line x1="24" y1="110" x2="150" y2="110"/>
      <line x1="24" y1="128" x2="118" y2="128"/>
      <line x1="24" y1="146" x2="148" y2="146"/>
      <line x1="24" y1="164" x2="126" y2="164"/>
    </g>
    <text x="88" y="196" fill="#888888" font-size="10" text-anchor="middle">太厚，仍接近上限</text>
  </g>

  <!-- Two actions -->
  <g transform="translate(276 116)">
    <path d="M 0 82 L 38 82" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green)" fill="none"/>

    <rect x="52" y="16" width="120" height="58" rx="6" fill="#fafafa" stroke="#d0d0d0"/>
    <path d="M 78 30 L 104 30 L 116 42 L 116 60 L 78 60 Z" fill="#ffffff" stroke="#1a1a1a"/>
    <path d="M 104 30 L 104 42 L 116 42" fill="none" stroke="#1a1a1a"/>
    <text x="112" y="92" fill="#1a1a1a" font-size="12" font-weight="700" text-anchor="middle">write_transcript()</text>
    <text x="112" y="108" fill="#888888" font-size="10" text-anchor="middle">完整记录先留底</text>

    <path d="M 112 120 L 112 150" stroke="#888888" stroke-width="1.5" marker-end="url(#arrow-gray)" fill="none"/>

    <rect x="52" y="158" width="120" height="58" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
    <text x="112" y="182" fill="#1a1a1a" font-size="12" font-weight="700" text-anchor="middle">summarize_history()</text>
    <text x="112" y="200" fill="#888888" font-size="10" text-anchor="middle">1 API call</text>

    <path d="M 186 186 L 232 186" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green)" fill="none"/>
  </g>

  <!-- After paper -->
  <g transform="translate(536 116)">
    <rect x="0" y="0" width="178" height="230" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M 144 0 L 178 34 L 144 34 Z" fill="#fafafa" stroke="#d0d0d0"/>
    <text x="89" y="30" fill="#1a1a1a" font-size="13" font-weight="700" text-anchor="middle">摘要历史</text>
    <text x="89" y="48" fill="#888888" font-size="10" text-anchor="middle" font-family="monospace">[Compacted]</text>

    <rect x="22" y="70" width="134" height="132" rx="5" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
    <text x="89" y="94" fill="#1a1a1a" font-size="10" font-weight="700" text-anchor="middle">保留关键线索</text>
    <text x="40" y="120" fill="#888888" font-size="9">- current goal</text>
    <text x="40" y="138" fill="#888888" font-size="9">- user constraints</text>
    <text x="40" y="156" fill="#888888" font-size="9">- findings</text>
    <text x="40" y="174" fill="#888888" font-size="9">- files changed</text>
    <text x="40" y="192" fill="#888888" font-size="9">- next steps</text>
    <text x="89" y="220" fill="#888888" font-size="10" text-anchor="middle">有损，所以放最后</text>
  </g>

  <g transform="translate(124 360)">
    <rect x="0" y="0" width="512" height="34" rx="6" fill="#fafafa" stroke="#d0d0d0"/>
    <text x="256" y="22" fill="#1a1a1a" font-size="12" font-weight="600" text-anchor="middle">核心动作：先保存完整历史，再用一份摘要替换当前上下文</text>
  </g>
</svg>
